<script>
var n = parseInt(prompt("Enter a number:"));
var temp = n;
var sum = 0;
while(temp > 0) {
    var digit = temp % 10;
    sum = sum + digit * digit * digit;
    temp = Math.floor(temp / 10);
}
if(sum == n)
    document.write(n + " is an Armstrong number");
else
    document.write(n + " is not an Armstrong number");
</script>
</body>
