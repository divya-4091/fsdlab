
<!DOCTYPE html>
<html>
<head>
    <title>Voter Eligibility</title>
</head>
<body>
  <p align="right"><b>P.Divya Spandana<br>24K61A1285</br></b></p>
    <h2>Voter Eligibility</h2>

    <script>
        // Get input from user
        let name = prompt("Enter your name:");
        let age = prompt("Enter your age:");

        // Convert age into number
        age = Number(age);

        // Check voting eligibility
        let eligibility;

        if (age >= 18) {
            eligibility = "Eligible to Vote";
        } else {
            eligibility = "Not Eligible to Vote";
        }

        // Display details in a table
        document.write("<table border='1'>");
        document.write("<tr>");
        document.write("<th>Name</th>");
        document.write("<th>Age</th>");
        document.write("<th>Voter Eligibility</th>");
        document.write("</tr>");

        document.write("<tr>");
        document.write("<td>" + name + "</td>");
        document.write("<td>" + age + "</td>");
        document.write("<td>" + eligibility + "</td>");
        document.write("</tr>");

        document.write("</table>");
    </script>

</body>
</html>
