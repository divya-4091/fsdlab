
<!DOCTYPE html>
<html>
<head>
    <title>JavaScript Output Methods</title>
</head>

<body>
 <p align="right"><b>P.Divya Spandana<br>24K61A1285</br></b></p>
    <h2>Different Ways of Displaying Output</h2>

    <p id="demo"></p>

    <script>
        // 1. Using innerHTML
        document.getElementById("demo").innerHTML =
            "Output using innerHTML";

        // 2. Using document.write()
        document.write("<br>Output using document.write()");

        // 3. Using window.alert()
        window.alert("Output using window.alert()");

        // 4. Using console.log()
        console.log("Output using console.log()");
    </script>

</body>
</html>
