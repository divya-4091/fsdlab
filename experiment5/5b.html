
<!DOCTYPE html>
<html>
<head>
    <title>Background Image</title>
 
    <style>
        body {
            margin: 0;
            min-height: 2000px;
        }

        body::before {
            content: "";
            position: fixed;
            top: 50%;
            left: 0;
            width: 100%;
            height: 300px;

            background-image: url("image.jpg");
            background-size: cover;
            background-position: center;

            transform: translateY(-50%) rotate(5deg);
            z-index: -1;
        }
    </style>
</head>

<body>

    <h1>Background Image Example</h1>
<p align="right"><b>P.Divya Spandana<br>24K61A1285</br></b></p>
    <p>Scroll the page. The background image remains fixed.</p>

</body>
</html>
