

<!DOCTYPE html>
<html>
<head>
    <title>CSS Colors</title>

    <style>
        /* 1. Color Name */
        .name {
            color: red;
        }

        /* 2. HEX Value */
        .hex {
            color: #0000ff;
        }
        /* 3. RGB Value */
        .rgb {
            color: rgb(0, 128, 0);
        }

        /* 4. RGBA Value */
        .rgba {
            color: rgba(255, 0, 0, 0.5);
        }

        /* 5. HSL Value */
        .hsl {
            color: hsl(240, 100%, 50%);
        }

        /* 6. HSLA Value */
        .hsla {
            color: hsla(120, 100%, 25%, 0.7);
        }
    </style>
</head>

<body>

<p align="right"><b>P.Divya Spandana<br>24K61A1285</br></b></p>
    <h1 class="name">Color using Name</h1>

    <h1 class="hex">Color using HEX</h1>

    <h1 class="rgb">Color using RGB</h1>

    <h1 class="rgba">Color using RGBA</h1>

    <h1 class="hsl">Color using HSL</h1>

    <h1 class="hsla">Color using HSLA</h1>

</body>
</html>
