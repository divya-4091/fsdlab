
<!DOCTYPE html>
<html>
<head>
    <title>CSS Text Properties</title>

    <style>
        .size {
            font-size: 25px;
        }

        .weight {
            font-weight: bold;
        }

        .style {
            font-style: italic;
        }

        .decoration {
            text-decoration: underline;
        }

        .transform {
            text-transform: uppercase;
        }

        .align {
            text-align: center;
        }
    </style>
</head>

<body>
<p align="right"><b>P.Divya Spandana<br>24K61A1285</br></b></p>
    <h1 class="align">CSS Text Properties</h1>

    <p class="size">This text demonstrates font-size.</p>

    <p class="weight">This text demonstrates font-weight.</p>

    <p class="style">This text demonstrates font-style.</p>

    <p class="decoration">This text demonstrates text-decoration.</p>

    <p class="transform">this text demonstrates text-transform.</p>

    <p class="align">This text demonstrates text-align.</p>

</body>
</html>
