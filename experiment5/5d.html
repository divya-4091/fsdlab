
<!DOCTYPE html>
<html>
<head>
    <title>CSS Box Model</title>

    <style>
        .box {
            width: 300px;              /* Content */
            height: 150px;

            padding: 30px;             /* Padding */

            border: 5px solid black;   /* Border */

            margin: 50px;              /* Margin */

            background-color: lightblue;
        }
    </style>
</head>

<body>

    <h1>CSS Box Model</h1>
<p align="right"><b>P.Divya Spandana<br>24K61A1285</br></b></p>
    <div class="box">
        This is the content area of the box.
        The space between the content and border is padding.
        The line around the box is the border.
        The space outside the border is the margin.
    </div>

</body>
</html>
