<h2>Math Object Example</h2>

<script>
let num = 25.6;

document.write("Value of PI: " + Math.PI + "<br>");
document.write("Round: " + Math.round(num) + "<br>");
document.write("Ceil: " + Math.ceil(num) + "<br>");
document.write("Floor: " + Math.floor(num) + "<br>");
document.write("Square Root: " + Math.sqrt(25) + "<br>");
document.write("Power: " + Math.pow(2, 3));
</script>

</body>
